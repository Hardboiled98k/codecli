name: Bug Report
description: 报告可复现的 CodeCLI 缺陷
title: "[Bug]: "
labels:
   - bug
body:
   - type: markdown
     attributes:
       value: |
         感谢反馈。安全漏洞请不要在这里公开，请改按 SECURITY.md 私下报告。
         请删除 API Key、Token、Cookie、用户名、私人路径和项目内容。
   - type: checkboxes
     id: checks
     attributes:
       label: 提交前确认
       options:
         - label: 我已搜索现有 Issue，未发现相同问题。
           required: true
         - label: 我没有附上 API Key、密码、Token、Cookie 或私人文件。
           required: true
         - label: 这不是需要私下报告的安全漏洞。
           required: true
   - type: input
     id: version
     attributes:
       label: CodeCLI 版本或提交号
       placeholder: 例如 v1.0.0 或完整 commit SHA
     validations:
       required: true
   - type: dropdown
     id: os
     attributes:
       label: 操作系统
       options:
         - macOS Apple Silicon
         - macOS Intel
         - Windows 11 x64
         - Windows 10 x64
         - 其他 / Unsupported
     validations:
       required: true
   - type: input
     id: os_version
     attributes:
       label: 操作系统版本
       placeholder: 例如 macOS 15.5 / Windows 11 24H2
     validations:
       required: true
   - type: textarea
     id: steps
     attributes:
       label: 复现步骤
       description: 请给出最小且确定的步骤。
       placeholder: |
         1. 打开……
         2. 选择……
         3. 出现……
     validations:
       required: true
   - type: textarea
     id: expected
     attributes:
       label: 预期结果
     validations:
       required: true
   - type: textarea
     id: actual
     attributes:
       label: 实际结果
     validations:
       required: true
   - type: textarea
     id: logs
     attributes:
       label: 已脱敏的日志或截图
       description: 可留空。提交前请再次人工检查敏感信息。
       render: shell
   - type: textarea
     id: context
     attributes:
       label: 其他信息
       description: 目标 CLI、Provider、安装来源，以及是否能稳定复现。
